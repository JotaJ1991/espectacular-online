<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Espectacular Online — Tú Preferida">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b16"/>
      <stop offset="1" stop-color="#160a26"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d90"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7b2ff7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#ff2d90" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff2d90" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo -->
  <g transform="translate(100,150)">
    <rect width="150" height="150" rx="34" fill="rgba(255,255,255,0.06)"/>
    <circle cx="75" cy="82" r="26" fill="none" stroke="#ff2d90" stroke-width="9"/>
    <circle cx="75" cy="82" r="8" fill="#00e5ff"/>
    <path d="M45 44 L105 44" stroke="#7b2ff7" stroke-width="9" stroke-linecap="round"/>
    <circle cx="105" cy="44" r="6" fill="#ff2d90"/>
  </g>

  <!-- Badge -->
  <g transform="translate(300,175)">
    <rect width="230" height="42" rx="21" fill="rgba(0,229,255,0.12)" stroke="rgba(0,229,255,0.4)"/>
    <circle cx="28" cy="21" r="7" fill="#ff2d90"/>
    <text x="48" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#00e5ff" letter-spacing="2">EN VIVO · 24/7</text>
  </g>

  <!-- Título -->
  <text x="300" y="290" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" fill="#f4f4fb">Espectacular</text>
  <text x="300" y="380" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" fill="url(#grad)">Online</text>

  <!-- Slogan -->
  <text x="302" y="438" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#a7a7bd">Tú Preferida · Música 24/7 · Sonido Profesional</text>

  <!-- Ecualizador decorativo -->
  <g transform="translate(300,500)" fill="url(#grad)">
    <rect x="0"   y="20" width="10" height="30" rx="5"/>
    <rect x="20"  y="0"  width="10" height="50" rx="5"/>
    <rect x="40"  y="30" width="10" height="20" rx="5"/>
    <rect x="60"  y="8"  width="10" height="42" rx="5"/>
    <rect x="80"  y="24" width="10" height="26" rx="5"/>
    <rect x="100" y="2"  width="10" height="48" rx="5"/>
    <rect x="120" y="18" width="10" height="32" rx="5"/>
    <rect x="140" y="30" width="10" height="20" rx="5"/>
  </g>

  <text x="1100" y="590" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#6f6f88">spectacularstereoonline</text>
</svg>
